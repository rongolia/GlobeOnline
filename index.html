    <title>Low-Poly 3D Earth Globe</title>
    <meta name="description" content="A stylized, colorful, low-poly interactive 3D Earth featuring country borders and smooth touch and mouse rotation." />
    <meta property="og:title" content="Low-Poly 3D Earth Globe" />

    <meta name="twitter:card" content="summary_large_image" />

    <!-- Country flag glyphs. Windows ships no flags in Segoe UI Emoji, so Chrome and
         Edge draw a flag emoji as its two letters instead. Google Fonts splits Noto
         Color Emoji by unicode-range and the regional-indicator block (U+1F1E6-1F1FF)
         is a subset of its own, so only that file is fetched, and only once a flag is
         actually on screen. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
